# Parameters of sensor_monitor_node (gnssd_tools) - part of the SYSTEM.
#
# Timeout = 5 x the nominal message period of each sensor. Five missing
# messages in a row cannot be explained by normal jitter or a busy
# scheduler (one or two late messages happen), but are still detected
# within a fraction of a second, long before the estimate degrades.
#   odom  50 Hz  -> period 0.02 s -> timeout 0.10 s
#   imu  100 Hz  -> period 0.01 s -> timeout 0.05 s
#   scan  10 Hz  -> period 0.10 s -> timeout 0.50 s
# A loss is therefore reported at most timeout + 1 / check_rate after the
# last message.

sensor_monitor_node:
  ros__parameters:
    sensors: ['odom', 'imu', 'scan']
    check_rate: 10.0         # Hz, how often the timeouts are evaluated
    report_rate: 1.0         # Hz, /diagnostics (plus immediately on every state change)
    rate_window: 2.0         # s, window of the measured rate
    low_rate_fraction: 0.5   # OK sensor below 50 % of its expected rate -> WARN

    # The monitor runs on the steady clock (see the node's docstring). Every
    # rtf_check_period seconds it samples one /clock message and warns if the
    # real-time factor deviates from 1 by more than rtf_tolerance.
    rtf_check_period: 10.0   # s
    rtf_tolerance: 0.05

    # Correction consistency check (Step 5c): INVALID if map->odom turns by more
    # than  floor_deg + k * drift_sigma * dt  (dt since the last accepted state at
    # least `window` old). drift_sigma = gyro bias of the sensor model, passed
    # by sim.launch.py from robot_params.xacro. Chosen from all recorded bags:
    # largest legitimate change 0.584 deg (threshold 3.02 deg, 5.2x margin),
    # smallest wrong correction 16.0 deg (threshold 5.07 deg after a 120 s
    # outage, 3.2x margin). Details: docs/progress.md, Step 5c.
    correction_check:
      k: 3.0
      floor_deg: 3.0
      window: 1.0              # s
      outage_memory: 30.0      # s, alarm this soon after a lidar outage is marked as such

    odom:
      topic: /odom
      type: odometry
      expected_rate: 50.0
      timeout: 0.10
    imu:
      topic: /imu
      type: imu
      expected_rate: 100.0
      timeout: 0.05
    scan:
      topic: /scan
      type: scan
      expected_rate: 10.0
      timeout: 0.50
