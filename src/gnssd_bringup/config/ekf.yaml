# Base layer: robot_localization EKF (node ekf_filter_node, executable ekf_node).
#
# Publishes /odometry/filtered and the TF odom -> base_link (the ONLY node
# that publishes this transform, see CLAUDE.md).
#
# What is fused, and why (thesis model, chapter 2):
#   * wheel odometry (/odom) gives the linear velocity v and the yaw rate w;
#   * the gyroscope (/imu) gives the yaw rate w only;
#   * no absolute heading source is fused: the IMU orientation (it would
#     need a magnetometer, unreliable indoors) and the accelerometer are NOT
#     used. The heading is obtained by integrating w, so it drifts; the
#     correction layer (SLAM) removes that drift later.
#
# Every *_config vector has 15 booleans in the order
#   x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az

ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0          # Hz, rate of /odometry/filtered and of the TF
    two_d_mode: true         # planar robot: z, roll, pitch and their rates are fixed at 0
    publish_tf: true         # odom -> base_link

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom        # this EKF estimates the continuous odom -> base_link

    # Wheel odometry: only the forward velocity vx and the yaw rate vyaw.
    # Its pose is NOT fused: it is itself just an integral of these velocities.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # Gyroscope: only the yaw rate (angular velocity about z).
    # IMU orientation and linear acceleration are NOT fused.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false

    # process_noise_covariance is intentionally NOT set: the package default
    # is used in this step (values recorded in docs/progress.md, Step 3).
    # It will be tuned and the tuning documented in a later step.

    print_diagnostics: true
